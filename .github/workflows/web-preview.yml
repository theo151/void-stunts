# Free test build, no Apple account needed: builds the game for the browser and publishes it to GitHub Pages.
# One-time: repo Settings → Pages → Source: "GitHub Actions". Needs only the UNITY_USERNAME / UNITY_PASSWORD secrets.
# Open https://<your-github-name>.github.io/<repo-name>/ in Safari on your iPhone. (No sound or haptics in the browser version.)
name: Web preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Assets/**', 'Packages/**', 'ProjectSettings/**', '.github/workflows/web-preview.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OUTPUT: Builds/WebGL
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: library-webgl-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('Assets/Resources/**', 'Assets/Scripts/**', 'Assets/Editor/**') }}
          restore-keys: |
            library-webgl-

      - uses: buildalon/unity-setup@v2
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          build-targets: WebGL

      - uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - uses: buildalon/unity-action@v3
        with:
          build-target: WebGL
          log-name: webgl
          args: -quit -batchmode -nographics -executeMethod VoidStunts.EditorTools.BuildScript.BuildWebGL

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Builds/WebGL

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
