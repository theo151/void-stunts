# Free test build, no Apple account needed: builds the game for the browser and publishes it to GitHub Pages.
# One-time: repo Settings → Pages → Source: "GitHub Actions". Needs only the UNITY_USERNAME / UNITY_PASSWORD secrets.
# Open https://<your-github-name>.github.io/<repo-name>/ in Safari on your iPhone. (No sound or haptics in the browser version.)
name: Web preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Assets/**', 'Packages/**', 'ProjectSettings/**', '.github/workflows/web-preview.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # macOS runner: Unity Hub's Linux package fails to install on GitHub's Ubuntu images (/opt/unityhub/unityhub missing).
    # Free and unlimited for public repositories.
    runs-on: macos-15
    timeout-minutes: 150
    env:
      OUTPUT: Builds/WebGL
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf ~/Library/Android/sdk /usr/local/share/dotnet ~/.dotnet ~/.rustup ~/.ghcup || true
          xcrun simctl delete all || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: library-webgl-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt', '.github/workflows/*.yml') }}-${{ hashFiles('Assets/Resources/**', 'Assets/Scripts/**', 'Assets/Editor/**') }}
          restore-keys: |
            library-webgl-

      - uses: buildalon/unity-setup@v3
        with:
          unity-version: 6000.3.29f1 (96d2fe17529c)   # must match ProjectSettings/ProjectVersion.txt
          build-targets: WebGL
          architecture: arm64

      - uses: buildalon/activate-unity-license@v3
        with:
          license: personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - uses: buildalon/unity-action@v4
        with:
          build-target: WebGL
          log-name: webgl
          args: -quit -batchmode -nographics -executeMethod VoidStunts.EditorTools.BuildScript.BuildWebGL

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Builds/WebGL

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
